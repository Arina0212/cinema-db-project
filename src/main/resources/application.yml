server:
  port: 8080

spring:
  application:
    name: cinema

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cinema}
    username: ${DB_USERNAME:cinema}
    password: ${DB_PASSWORD:cinema}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    ru.urfu.cinema: INFO
