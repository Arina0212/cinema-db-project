services:
  postgres:
    image: postgres:17-alpine
    container_name: cinema-postgres
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    ports:
      # 5433 на хосте: локальный PostgreSQL на 5432 не мешает контейнеру
      - "5433:5432"
    volumes:
      - cinema_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cinema_pgdata:
